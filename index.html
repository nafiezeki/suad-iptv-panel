<!DOCTYPE html>

<html lang="sq">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SUAD IPTV Panel</title>

<style>

body{font-family:Arial;background:#101827;color:white;padding:20px}

main{max-width:450px;margin:auto}

section{background:#202d42;padding:20px;border-radius:15px}

input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border:0;border-radius:8px}

button{background:#17bd85;color:white;font-weight:bold}

pre{white-space:pre-wrap;overflow-wrap:anywhere}

</style>

</head>

<body>

<main>

<h1>📺 SUAD IPTV</h1>

<section>

<h3>Panel personal - Test</h3>

<input id="user" placeholder="Username">

<button onclick="createCode()">Krijo kod testues</button>

<pre id="result"></pre>

</section>

</main>

<script>

function createCode(){


const user = document.getElementById("user").value.trim();
if (!user) {
  alert("Shkruaj username");
  return;
}
const bytes = new Uint8Array(12);
crypto.getRandomValues(bytes);
const pass = Array.from(bytes, b =>
  b.toString(16).padStart(2, "0")
).join("");
document.getElementById("result").textContent =
  "Username: " + user +
  "\nPassword: " + pass +
  "\nVetem per testim.";
}
</script>

<section>
  <h2>🌍 Kanalet e botes</h2>
  <p>Lista M3U</p>
  <input id="m3u" value="https://iptv-org.github.io/iptv/index.m3u">
  <button onclick="loadTV()">Hap kanalet</button>
  <p id="status"></p>
  <div id="channels"></div>
  <video id="player" controls playsinline
    style="width:100%;margin-top:15px"></video>
</section>
<script>
async function loadTV() {
  const status = document.getElementById("status");
  const channels = document.getElementById("channels");
  channels.innerHTML = "";
  status.textContent = "Duke ngarkuar...";
  try {
    const url = document.getElementById("m3u").value;
    const response = await fetch(url);
    if (!response.ok) throw Error("Lista nuk u hap");
    const lines = (await response.text()).split(/\r?\n/);
    let count = 0;
    for (let i = 0; i < lines.length - 1 && count < 200; i++) {
      if (!lines[i].startsWith("#EXTINF:")) continue;
      const name = lines[i].split(",").slice(1).join(",") || "Kanal";
      const stream = lines[i + 1].trim();
      if (!stream.startsWith("https://")) continue;
      const btn = document.createElement("button");
      btn.textContent = name;
      btn.onclick = () => {
        const player = document.getElementById("player");
        player.src = stream;
        player.play().catch(() => {});
      };
      channels.appendChild(btn);
      count++;
    }
    status.textContent = count + " kanale u gjeten";
  } catch (e) {
    status.textContent = "Lista nuk u ngarkua ne Safari.";
  }
}
</script>
</body>
</html>
